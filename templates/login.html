{% extends 'base.html' %}

{% block title %}Giriş Yap - BloggerDev{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Hoş Geldiniz</h1>
        <p class="auth-subtitle">Hesabınıza giriş yapın</p>
        
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label class="form-label">E-posta</label>
                <input type="email" name="email" class="form-input" placeholder="ornek@email.com" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Şifre</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="auth-btn">Giriş Yap</button>
        </form>
        
        <p class="auth-footer">
            Hesabınız yok mu? <a href="{{ url_for('register') }}">Kayıt olun</a>
        </p>
    </div>
</div>
{% endblock %}
