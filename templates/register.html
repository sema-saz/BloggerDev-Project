{% extends 'base.html' %}

{% block title %}Kayıt Ol - BloggerDev{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Hesap Oluşturun</h1>
        <p class="auth-subtitle">BloggerDev'e katılın</p>
        
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label class="form-label">Adınız</label>
                <input type="text" name="name" class="form-input" placeholder="Adınız Soyadınız" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">E-posta</label>
                <input type="email" name="email" class="form-input" placeholder="ornek@email.com" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Şifre</label>
                <input type="password" name="password" class="form-input" placeholder="En az 6 karakter" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Şifre Tekrar</label>
                <input type="password" name="password_confirm" class="form-input" placeholder="Şifrenizi tekrar girin" required>
            </div>
            
            <button type="submit" class="auth-btn">Kayıt Ol</button>
        </form>
        
        <p class="auth-footer">
            Zaten hesabınız var mı? <a href="{{ url_for('login') }}">Giriş yapın</a>
        </p>
    </div>
</div>
{% endblock %}
