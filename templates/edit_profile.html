{% extends 'base.html' %}

{% block title %}Profili Düzenle - BloggerDev{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Profili Düzenle</h1>
        <p class="auth-subtitle">Bilgilerinizi güncelleyin</p>
        
        <form method="POST" action="{{ url_for('edit_profile') }}">
            <div class="form-group">
                <label class="form-label">Adınız</label>
                <input type="text" name="name" class="form-input" value="{{ user.users_name }}" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">E-posta</label>
                <input type="email" class="form-input" value="{{ user.users_email }}" disabled>
                <small style="color:#8a7a9a;font-size:12px;">E-posta değiştirilemez</small>
            </div>
            
            <div class="form-group">
                <label class="form-label">Adres</label>
                <input type="text" name="address" class="form-input" value="{{ user.users_address or '' }}" placeholder="Şehir, Ülke">
            </div>
            
            <button type="submit" class="auth-btn">Kaydet</button>
        </form>
        
        <p class="auth-footer">
            <a href="{{ url_for('profile') }}">← Profile Dön</a>
        </p>
    </div>
</div>
{% endblock %}
